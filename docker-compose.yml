services:
  web:
    build: .
    env_file:         # <-- AÑADE ESTA LÍNEA
      - .env          # <-- AÑADE ESTA LÍNEA
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your environment or .env file}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your environment or .env file}
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8000), timeout=3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
