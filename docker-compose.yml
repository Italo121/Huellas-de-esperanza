services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-require}
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8000), timeout=3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
