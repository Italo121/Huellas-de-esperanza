<nav class="navbar bg-white border-bottom rounded-3 shadow-sm px-3 px-md-4 py-3 mb-4"
     aria-label="Barra de cuenta">
    <a class="navbar-brand fw-bold text-success mb-0"
       href="{% url 'inicio_refugio' %}">
        <i class="bi bi-heart-fill text-warning me-2" aria-hidden="true"></i>
        Huellas de esperanza
    </a>

    <div class="d-flex align-items-center gap-3 ms-auto">
        <button class="btn btn-light" type="button" aria-label="Notificaciones">
            <i class="bi bi-bell-fill" aria-hidden="true"></i>
        </button>

        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle me-1" aria-hidden="true"></i>
                {{ request.session.refugio_usuario.nombre|default:"Mi cuenta" }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                {% if request.session.refugio_usuario %}
                <li>
                    <span class="dropdown-item-text small text-secondary">
                        {{ request.session.refugio_usuario.correo }}
                    </span>
                </li>
                <li>
                    <form method="post" action="{% url 'logout_usuario' %}">
                        {% csrf_token %}
                        <button class="dropdown-item text-danger" type="submit">
                            <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>
                            Cerrar sesión
                        </button>
                    </form>
                </li>
                {% else %}
                <li>
                    <a class="dropdown-item"
                       href="{% url 'login_usuario' %}?next={{ request.get_full_path|urlencode }}">
                        <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>
                        Iniciar sesión
                    </a>
                </li>
                <li>
                    <a class="dropdown-item" href="{% url 'registro_usuario' %}">
                        <i class="bi bi-person-plus me-2" aria-hidden="true"></i>
                        Crear cuenta
                    </a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
<script defer
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
